name: ping

on:
  schedule:
    # two offset expressions -> every 5 min, avoiding :00 congestion drops
    - cron: "1,11,21,31,41,51 * * * *"
    - cron: "6,16,26,36,46,56 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # Each honored run pings several times over ~4.5 min to widen coverage
      # when GitHub's scheduler fires sparsely.
      - name: Ping
        run: |
          set -uo pipefail
          for i in 1 2 3 4; do
            echo "ping $i at $(date -u +%H:%M:%SZ)"
            curl -fsS --max-time 120 \
              -H "Authorization: Bearer ${{ secrets.PING_TOKEN }}" \
              "${{ secrets.PING_URL }}" | head -c 1000 || echo "(ping $i failed, continuing)"
            echo
            [ "$i" -lt 4 ] && sleep 90 || true
          done
      # GitHub disables schedules after 60 days without repo activity;
      # push an empty keepalive commit when the last one is >20 days old.
      - name: Keepalive
        run: |
          set -uo pipefail
          git clone --depth 2 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ka
          cd ka
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          if [ $(( NOW - LAST )) -gt 1728000 ]; then
            git config user.name "keepalive"
            git config user.email "keepalive@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push origin HEAD
            echo "keepalive commit pushed"
          else
            echo "repo active $(( (NOW - LAST) / 86400 ))d ago, no keepalive needed"
          fi

  # REOS cron-dispatch backstop (moved here 2026-07-21 from the private
  # repo's reos-cron workflow, which is billing-blocked: private-repo Actions
  # minutes are metered and the account's spending limit halts them; this
  # repo is public = free minutes). The dispatch endpoint is the same
  # in-app round-robin the every-minute Vercel outbox drains already drive —
  # this job is pure INSURANCE for Vercel cron outages, which the operator
  # has observed. Redis SET NX claims inside the dispatcher make overlapping
  # invocations no-ops, so the extra cadence is harmless.
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Hit the REOS dispatch endpoint
        run: |
          set -uo pipefail
          for i in 1 2; do
            echo "dispatch attempt $i at $(date -u +%H:%M:%SZ)"
            curl -fsS --max-time 120 \
              -H "Authorization: Bearer ${{ secrets.REOS_DISPATCH_SECRET }}" \
              "https://reos-crm.vercel.app/api/command-center/cron/dispatch" \
              | head -c 1000 || echo "(dispatch attempt $i failed, continuing)"
            echo
            [ "$i" -lt 2 ] && sleep 60 || true
          done
