name: ping

on:
  schedule:
    # two offset expressions -> every 5 min, avoiding :00 congestion drops
    - cron: "1,11,21,31,41,51 * * * *"
    - cron: "6,16,26,36,46,56 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# NO workflow-level concurrency, and NO in-run sleep loops. Both used to be here
# and together they defeated the schedule this file asks for:
#
#   the ping job looped 4 curls with 90s sleeps and then CLONED the repo for the
#   keepalive check, so one run took 5-12 minutes. Against a 5-minute schedule
#   plus `concurrency: group: ping` that is guaranteed overlap, and GitHub
#   resolves overlap by CANCELLING the queued run. Observed 2026-08-05: a
#   workflow written for every 5 minutes was really firing in pairs about every
#   2 HOURS, the four most recent runs all "cancelled" — at the same time REOS's
#   PRIMARY scheduler (the Mac poller on the macOS VPS) was gone, because the
#   VPS itself had been cancelled. Net effect: nothing scheduled ran in REOS for
#   hours, and no alert could reach the operator, because the alert channel is
#   iMessage on that same dead VPS.
#
# Runs are now single-shot and finish well inside a minute, so consecutive
# 5-minute firings never collide. Any overlap that does slip through is
# harmless: the dispatcher claims each route in Redis with SET NX for that
# route's cadence, so a second concurrent invocation is a no-op. Keepalive moved
# to keepalive.yml, so the repo-clone cost is paid every 10 days, not every run.
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping
        run: |
          set -uo pipefail
          curl -fsS --max-time 240 \
            -H "Authorization: Bearer ${{ secrets.PING_TOKEN }}" \
            "${{ secrets.PING_URL }}" | head -c 1000 || echo "(ping failed)"
          echo

  # REOS cron-dispatch backstop (moved here 2026-07-21 from the private repo's
  # reos-cron workflow, which is billing-blocked: private-repo Actions minutes
  # are metered and the account's spending limit halts them; this repo is public
  # = free minutes). Do NOT move it back to the private repo.
  #
  # /cron/dispatch fans out to everything time-based: email sync, the iMessage
  # monitor, canary, keepalive, both outbox drains, follow-up auto-send, and the
  # Intelius queue drain. It dispatches only 3 routes per tick, round-robin over
  # ~25 routes, so the cadence here sets how fast the whole system turns over:
  # every 5 min => full coverage in ~40 min. The 60s Mac poller gave ~8 min, so
  # this is insurance, not a replacement — restore the poller on the Mac mini.
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit the REOS dispatch endpoint
        run: |
          set -uo pipefail
          curl -fsS --max-time 240 \
            -H "Authorization: Bearer ${{ secrets.REOS_DISPATCH_SECRET }}" \
            "https://reos-crm.vercel.app/api/command-center/cron/dispatch" \
            | head -c 1000 || echo "(dispatch failed)"
          echo
